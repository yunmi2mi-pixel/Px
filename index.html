<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>전역 & 휴가 플래너</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --card: #ffffff;
      --text: #191f28;
      --sub: #6b7684;
      --border: #e5e8eb;
      --primary: #3182f6;
      --primary-light: #e8f3ff;
      --danger: #f04452;
      --danger-light: #ffeeee;
      --success: #00b87c;
      --success-light: #e6f8f2;
      --warning: #ff9800;
      --warning-light: #fff4e5;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding-bottom: 84px;
    }

    .container {
      max-width: 540px;
      margin: 0 auto;
      padding: 16px;
    }

    /* Header & D-Day Banner */
    .hero {
      background: linear-gradient(135deg, #1b64da, #3182f6);
      color: #fff;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 8px 20px rgba(49, 130, 246, 0.22);
    }

    .hero-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .hero-title {
      font-size: 14px;
      opacity: 0.9;
      font-weight: 600;
    }

    .dday-badge {
      background: rgba(255, 255, 255, 0.2);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
    }

    .hero-main {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 14px;
    }

    .hero-dday {
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .hero-date {
      font-size: 13px;
      opacity: 0.85;
    }

    .progress-wrap {
      background: rgba(255, 255, 255, 0.22);
      height: 8px;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 6px;
    }

    .progress-bar {
      background: #fff;
      height: 100%;
      border-radius: 999px;
      transition: width 0.3s ease;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      opacity: 0.9;
    }

    /* Cards */
    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 18px;
      margin-bottom: 14px;
      border: 1px solid var(--border);
    }

    .card-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-sub {
      font-size: 12px;
      color: var(--sub);
      font-weight: 500;
    }

    /* Summary Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }

    .stat-box {
      background: var(--bg);
      padding: 12px 10px;
      border-radius: 12px;
      text-align: center;
    }

    .stat-label {
      font-size: 12px;
      color: var(--sub);
      margin-bottom: 4px;
    }

    .stat-val {
      font-size: 20px;
      font-weight: 800;
    }

    .stat-val.primary { color: var(--primary); }
    .stat-val.success { color: var(--success); }
    .stat-val.danger { color: var(--danger); }

    /* Form Controls */
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .field {
      margin-bottom: 12px;
    }

    .field label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--sub);
      margin-bottom: 5px;
    }

    input[type="text"],
    input[type="number"],
    input[type="date"],
    select,
    textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
      font-family: inherit;
      background: #fff;
      color: var(--text);
      outline: none;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--primary);
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text);
      margin: 8px 0 12px;
      cursor: pointer;
    }

    .checkbox-row input {
      width: 16px;
      height: 16px;
      accent-color: var(--primary);
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: none;
      border-radius: 10px;
      padding: 11px 16px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s;
      font-family: inherit;
    }

    .btn:active { opacity: 0.75; }
    .btn-primary { background: var(--primary); color: #fff; width: 100%; }
    .btn-soft { background: var(--primary-light); color: var(--primary); }
    .btn-danger-soft { background: var(--danger-light); color: var(--danger); }
    .btn-gray { background: var(--bg); color: var(--text); }
    .btn-sm { padding: 6px 10px; font-size: 12px; border-radius: 8px; }

    /* Malchul Box */
    .malchul-result {
      background: var(--primary-light);
      border-radius: 12px;
      padding: 14px;
      margin-top: 10px;
    }

    .malchul-date {
      font-size: 18px;
      font-weight: 800;
      color: var(--primary);
      margin: 4px 0;
    }

    .malchul-desc {
      font-size: 12px;
      color: #335c99;
    }

    /* Schedule List */
    .plan-item {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 10px;
      background: #fff;
    }

    .plan-item.is-malchul {
      border-color: var(--primary);
      background: #f8fbff;
    }

    .plan-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 6px;
    }

    .plan-title {
      font-size: 15px;
      font-weight: 700;
    }

    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

    .badge-malchul { background: var(--primary); color: #fff; }
    .badge-leave { background: var(--primary-light); color: var(--primary); }
    .badge-pass { background: var(--warning-light); color: var(--warning); }
    .badge-done { background: var(--success-light); color: var(--success); }

    .plan-meta {
      font-size: 13px;
      color: var(--sub);
      margin-bottom: 6px;
    }

    .plan-memo {
      font-size: 13px;
      background: var(--bg);
      padding: 8px 10px;
      border-radius: 8px;
      margin-bottom: 10px;
      color: #4e5968;
      white-space: pre-wrap;
    }

    .plan-actions {
      display: flex;
      justify-content: flex-end;
      gap: 6px;
    }

    /* Checklist */
    .check-group-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--primary);
      margin: 14px 0 8px;
    }

    .check-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }

    .check-item:last-child { border-bottom: none; }

    .check-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      cursor: pointer;
    }

    .check-left input {
      width: 18px;
      height: 18px;
      accent-color: var(--primary);
      flex-shrink: 0;
    }

    .check-text {
      font-size: 14px;
    }

    .check-text.done {
      text-decoration: line-through;
      color: var(--sub);
    }

    /* Bottom Tabs */
    .tab-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #fff;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
      z-index: 100;
    }

    .tab-btn {
      background: none;
      border: none;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      color: var(--sub);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 4px 12px;
      cursor: pointer;
    }

    .tab-btn.active {
      color: var(--primary);
      font-weight: 700;
    }

    .tab-icon {
      font-size: 18px;
    }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    .empty-state {
      text-align: center;
      padding: 28px 10px;
      color: var(--sub);
      font-size: 14px;
    }

    .toast {
      position: fixed;
      bottom: 76px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(25, 31, 40, 0.9);
      color: #fff;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
      z-index: 200;
      white-space: nowrap;
    }

    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="container">
    <!-- Hero D-Day -->
    <div class="hero">
      <div class="hero-top">
        <span class="hero-title">전역 & 말출 플래너</span>
        <span class="dday-badge" id="heroPercent">0.0%</span>
      </div>
      <div class="hero-main">
        <div class="hero-dday" id="heroDday">D-000</div>
        <div class="hero-date" id="heroDischargeText">전역일 2027.07.25</div>
      </div>
      <div class="progress-wrap">
        <div class="progress-bar" id="heroProgressBar" style="width: 0%;"></div>
      </div>
      <div class="progress-meta">
        <span id="heroEnlistText">입대 2026.01.26</span>
        <span id="heroServedText">복무 0일 / 전체 0일</span>
      </div>
    </div>

    <!-- TAB 1: 대시보드 -->
    <section class="tab-panel active" id="tab-dashboard">
      <div class="card">
        <div class="card-title">
          <span>휴가 현황 요약</span>
          <span class="card-sub">차감 일정 기준</span>
        </div>
        <div class="stats-grid">
          <div class="stat-box">
            <div class="stat-label">총 가용 휴가</div>
            <div class="stat-val primary" id="statTotal">0일</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">계획/사용</div>
            <div class="stat-val" id="statUsed">0일</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">잔여 휴가</div>
            <div class="stat-val success" id="statRemain">0일</div>
          </div>
        </div>

        <div class="grid-2">
          <div class="field">
            <label for="inAnnual">연가 (일)</label>
            <input type="number" id="inAnnual" min="0" value="0" />
          </div>
          <div class="field">
            <label for="inReward">포상휴가 (일)</label>
            <input type="number" id="inReward" min="0" value="0" />
          </div>
          <div class="field">
            <label for="inOther">위로·보상휴가 (일)</label>
            <input type="number" id="inOther" min="0" value="0" />
          </div>
          <div class="field">
            <label for="inExpected">추가 예정 휴가 (일)</label>
            <input type="number" id="inExpected" min="0" value="0" />
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">
          <span>말출 출발일 역산기</span>
          <button class="btn btn-soft btn-sm" id="btnApplyRemainToMalchul">잔여일수 적용</button>
        </div>
        <div class="grid-2">
          <div class="field">
            <label for="malchulDays">말출 사용 일수 (일)</label>
            <input type="number" id="malchulDays" min="1" value="15" />
          </div>
          <div class="field">
            <label for="malchulType">복귀 방식</label>
            <select id="malchulType">
              <option value="no-return">미복귀 전역 (전역일 종료)</option>
              <option value="return-before">전역 전날 복귀</option>
            </select>
          </div>
        </div>
        <div class="malchul-result">
          <div class="card-sub">예상 말출 출발일</div>
          <div class="malchul-date" id="malchulStartOut">-</div>
          <div class="malchul-desc" id="malchulDescOut">-</div>
        </div>
        <button class="btn btn-primary" id="btnAddMalchulPlan" style="margin-top: 12px;">
          이 일정으로 말출 계획표에 등록하기
        </button>
      </div>
    </section>

    <!-- TAB 2: 휴가 일정표 -->
    <section class="tab-panel" id="tab-plans">
      <div class="card">
        <div class="card-title">
          <span id="formHeading">새 휴가·외박 일정 추가</span>
          <button class="btn btn-gray btn-sm" id="btnCancelEdit" style="display:none;">취소</button>
        </div>
        <input type="hidden" id="editPlanId" value="" />
        <div class="grid-2">
          <div class="field">
            <label for="planTitle">일정명</label>
            <input type="text" id="planTitle" placeholder="예: 1월 스키장 여행" />
          </div>
          <div class="field">
            <label for="planType">구분</label>
            <select id="planType">
              <option value="중간휴가">중간휴가</option>
              <option value="말출">말출 (말년휴가)</option>
              <option value="외박/외출">외박/외출</option>
            </select>
          </div>
        </div>
        <div class="grid-2">
          <div class="field">
            <label for="planStart">시작일</label>
            <input type="date" id="planStart" />
          </div>
          <div class="field">
            <label for="planEnd">종료일</label>
            <input type="date" id="planEnd" />
          </div>
        </div>
        <label class="checkbox-row">
          <input type="checkbox" id="planNoDeduct" />
          <span>휴가 일수 차감 안 함 (외박·외출 등)</span>
        </label>
        <div class="field">
          <label for="planMemo">메모 (교통, 예약, 목표 등)</label>
          <textarea id="planMemo" rows="2" placeholder="예: KTX 6호차 창가 예매, 국외여행 허가 신청"></textarea>
        </div>
        <button class="btn btn-primary" id="btnSavePlan">일정 저장</button>
      </div>

      <div class="card">
        <div class="card-title">
          <span>등록된 일정 목록</span>
          <span class="card-sub" id="planCountText">0건</span>
        </div>
        <div id="planList"></div>
      </div>
    </section>

    <!-- TAB 3: 체크리스트 -->
    <section class="tab-panel" id="tab-checklist">
      <div class="card">
        <div class="card-title">
          <span>말출 & 전역 체크리스트</span>
          <span class="card-sub" id="checkProgressText">0 / 0 완료</span>
        </div>
        <div class="grid-2" style="margin-bottom: 10px;">
          <select id="checkCategory">
            <option value="행정·인수인계">행정·인수인계</option>
            <option value="전역 준비">전역 준비</option>
            <option value="말출 목표">말출 목표</option>
          </select>
          <input type="text" id="checkInput" placeholder="항목 입력 후 추가" />
        </div>
        <button class="btn btn-primary" id="btnAddCheck">체크리스트 항목 추가</button>
      </div>

      <div class="card" id="checklistContainer"></div>
    </section>

    <!-- TAB 4: 설정 및 백업 -->
    <section class="tab-panel" id="tab-settings">
      <div class="card">
        <div class="card-title">복무 기간 설정</div>
        <div class="grid-2">
          <div class="field">
            <label for="setEnlist">입대일</label>
            <input type="date" id="setEnlist" />
          </div>
          <div class="field">
            <label for="setDischarge">전역일</label>
            <input type="date" id="setDischarge" />
          </div>
        </div>
        <button class="btn btn-primary" id="btnSaveDates">날짜 적용</button>
      </div>

      <div class="card">
        <div class="card-title">데이터 백업 & 복원</div>
        <p style="font-size: 13px; color: var(--sub); margin-bottom: 12px;">
          데이터는 현재 브라우저에 자동 저장됩니다. 기기를 바꾸거나 초기화할 때 아래 백업 기능을 사용하세요.
        </p>
        <div class="grid-2" style="margin-bottom: 10px;">
          <button class="btn btn-soft" id="btnExportJson">JSON 백업 복사</button>
          <button class="btn btn-gray" id="btnImportJson">JSON 붙여넣기 복원</button>
        </div>
        <button class="btn btn-danger-soft" id="btnResetAll" style="width: 100%;">전체 데이터 초기화</button>
      </div>
    </section>
  </div>

  <!-- Bottom Tab Navigation -->
  <nav class="tab-bar" id="tabBar">
    <button class="tab-btn active" data-tab="tab-dashboard">
      <span class="tab-icon">📊</span>
      <span>현황·말출</span>
    </button>
    <button class="tab-btn" data-tab="tab-plans">
      <span class="tab-icon">🗓️</span>
      <span>휴가일정</span>
    </button>
    <button class="tab-btn" data-tab="tab-checklist">
      <span class="tab-icon">✅</span>
      <span>체크리스트</span>
    </button>
    <button class="tab-btn" data-tab="tab-settings">
      <span class="tab-icon">⚙️</span>
      <span>설정</span>
    </button>
  </nav>

  <div class="toast" id="toast">저장되었습니다.</div>

  <script>
    const STORAGE_KEY = 'roka_leave_planner_v1';

    const DEFAULT_STATE = {
      enlistDate: '2026-01-26',
      dischargeDate: '2027-07-25',
      leavePool: {
        annual: 15,
        reward: 10,
        other: 0,
        expected: 5
      },
      malchulCalc: {
        days: 15,
        type: 'no-return'
      },
      plans: [
        {
          id: 'p1',
          title: '12월 연말 외박',
          type: '외박/외출',
          start: '2026-12-19',
          end: '2026-12-20',
          noDeduct: true,
          memo: '가족 모임 / 부대 인근 숙소'
        },
        {

          title: '1월 스키장 여행',
          type: '중간휴가',

          end: '2027-01-17',
          noDeduct: false,
          memo: '3박 4일 비발디파크 리프트권 및 장비 예약'
        },
        {
          id: 'p3',
          title: '3월 후쿠오카 여행',
          type: '중간휴가',
          start: '2027-03-11',
          end: '2027-03-17',
          noDeduct: false,
          memo: '국외여행 허가 출국 1~2개월 전 신청 필수 / 김해공항 출국'
        }
      ],
      checklist: [
        { id: 'c1', category: '행정·인수인계', text: '후임 업무 인수인계서 작성 및 완료 (말출 2주 전)', done: false },
        { id: 'c2', category: '행정·인수인계', text: '국외여행 허가 신청 및 여권 유효기간 확인', done: false },
        { id: 'c3', category: '행정·인수인계', text: '부대 1회 최대 출타 일수 및 미복귀 전역 규정 확인', done: false },
        { id: 'c4', category: '전역 준비', text: '보급품 반납 목록 점검 및 세탁', done: false },
        { id: 'c5', category: '전역 준비', text: '장병내일준비적금 만기 해지 서류(가입자격확인서/전역증) 체크', done: false },
        { id: 'c6', category: '말출 목표', text: '전역 전 운동 목표(3대 500) 최종 측정', done: false },
        { id: 'c7', category: '말출 목표', text: '복학 및 시험 준비 생활 루틴 세팅', done: false }
      ]
    };

    let state = loadState();

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return structuredClone(DEFAULT_STATE);
        const parsed = JSON.parse(raw);
        return {
          ...structuredClone(DEFAULT_STATE),
          ...parsed,
          leavePool: { ...DEFAULT_STATE.leavePool, ...(parsed.leavePool || {}) },
          malchulCalc: { ...DEFAULT_STATE.malchulCalc, ...(parsed.malchulCalc || {}) }
        };
      } catch {
        return structuredClone(DEFAULT_STATE);
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(el._timer);
      el._timer = setTimeout(() => el.classList.remove('show'), 2000);
    }

    // Date Helpers (Timezone-safe)
    function parseDate(str) {
      if (!str) return null;
      const [y, m, d] = str.split('-').map(Number);
      return new Date(y, m - 1, d);
    }

    function formatDate(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function formatKoreanDate(str) {
      const d = parseDate(str);
      if (!d) return '-';
      const days = ['일', '월', '화', '수', '목', '금', '토'];
      return `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')} (${days[d.getDay()]})`;
    }

    function calcInclusiveDays(startStr, endStr) {
      const s = parseDate(startStr);
      const e = parseDate(endStr);
      if (!s || !e || e < s) return 0;
      return Math.round((e - s) / 86400000) + 1;
    }

    function addDays(date, offset) {
      const copy = new Date(date.getTime());
      copy.setDate(copy.getDate() + offset);
      return copy;
    }

    // Render Hero
    function renderHero() {
      const today = new Date();
      const todayMidnight = new Date(today.getFullYear(), today.getMonth(), today.getDate());
      const enlist = parseDate(state.enlistDate);
      const discharge = parseDate(state.dischargeDate);

      const totalDays = Math.max(1, Math.round((discharge - enlist) / 86400000));
      const servedDays = Math.min(totalDays, Math.max(0, Math.round((todayMidnight - enlist) / 86400000)));
      const remainDays = Math.round((discharge - todayMidnight) / 86400000);
      const percent = Math.min(100, Math.max(0, (servedDays / totalDays) * 100));

      document.getElementById('heroDday').textContent =
        remainDays > 0 ? `D-${remainDays}` : remainDays === 0 ? 'D-DAY' : `전역 +${Math.abs(remainDays)}`;
      document.getElementById('heroPercent').textContent = `${percent.toFixed(1)}%`;
      document.getElementById('heroProgressBar').style.width = `${percent}%`;
      document.getElementById('heroEnlistText').textContent = `입대 ${state.enlistDate.replaceAll('-', '.')}`;
      document.getElementById('heroDischargeText').textContent = `전역 ${state.dischargeDate.replaceAll('-', '.')}`;
      document.getElementById('heroServedText').textContent = `복무 ${servedDays}일 / 전체 ${totalDays}일`;
    }

    // Render Dashboard & Malchul Calculator
    function getLeaveSummary() {
      const { annual, reward, other, expected } = state.leavePool;
      const total = Number(annual || 0) + Number(reward || 0) + Number(other || 0) + Number(expected || 0);
      const used = state.plans.reduce((sum, p) => {
        if (p.noDeduct) return sum;
        return sum + calcInclusiveDays(p.start, p.end);
      }, 0);
      return { total, used, remain: total - used };
    }

    function renderDashboard() {
      const { annual, reward, other, expected } = state.leavePool;
      document.getElementById('inAnnual').value = annual;
      document.getElementById('inReward').value = reward;
      document.getElementById('inOther').value = other;
      document.getElementById('inExpected').value = expected;

      const { total, used, remain } = getLeaveSummary();
      document.getElementById('statTotal').textContent = `${total}일`;
      document.getElementById('statUsed').textContent = `${used}일`;
      const remainEl = document.getElementById('statRemain');
      remainEl.textContent = `${remain}일`;
      remainEl.className = `stat-val ${remain < 0 ? 'danger' : 'success'}`;

      document.getElementById('malchulDays').value = state.malchulCalc.days;
      document.getElementById('malchulType').value = state.malchulCalc.type;
      renderMalchulPreview();
    }

    function getMalchulRange() {
      const days = Math.max(1, Number(state.malchulCalc.days || 1));
      const discharge = parseDate(state.dischargeDate);
      const isNoReturn = state.malchulCalc.type === 'no-return';
      const endDate = isNoReturn ? discharge : addDays(discharge, -1);
      const startDate = addDays(endDate, -(days - 1));
      return { startStr: formatDate(startDate), endStr: formatDate(endDate), days, isNoReturn };
    }

    function renderMalchulPreview() {
      const { startStr, endStr, days, isNoReturn } = getMalchulRange();
      const nights = days - 1;
      document.getElementById('malchulStartOut').textContent = formatKoreanDate(startStr);
      document.getElementById('malchulDescOut').textContent =
        `${nights}박 ${days}일 (${formatKoreanDate(startStr)} ~ ${formatKoreanDate(endStr)}) · ${isNoReturn ? '미복귀 전역' : '전역 전날 복귀'}`;
    }

    // Render Plans
    function renderPlans() {
      const list = document.getElementById('planList');
      const sorted = [...state.plans].sort((a, b) => a.start.localeCompare(b.start));
      document.getElementById('planCountText').textContent = `${sorted.length}건`;

      if (sorted.length === 0) {
        list.innerHTML = `<div class="empty-state">등록된 휴가 일정이 없습니다. 위에서 새 일정을 추가해 보세요.</div>`;
        return;
      }

      list.innerHTML = sorted.map(p => {
        const days = calcInclusiveDays(p.start, p.end);
        const nights = Math.max(0, days - 1);
        const isMalchul = p.type === '말출';
        const badgeClass = isMalchul ? 'badge-malchul' : (p.type === '외박/외출' ? 'badge-pass' : 'badge-leave');
        const deductText = p.noDeduct ? '일수 미차감' : `${days}일 차감`;

        return `
          <div class="plan-item ${isMalchul ? 'is-malchul' : ''}" data-id="${p.id}">
            <div class="plan-top">
              <div class="plan-title">${escapeHtml(p.title)}</div>
              <span class="badge ${badgeClass}">${p.type}</span>
            </div>
            <div class="plan-meta">
              ${formatKoreanDate(p.start)} ~ ${formatKoreanDate(p.end)} · <strong>${nights}박 ${days}일</strong> (${deductText})
            </div>
            ${p.memo ? `<div class="plan-memo">${escapeHtml(p.memo)}</div>` : ''}
            <div class="plan-actions">
              <button class="btn btn-gray btn-sm" data-action="edit" data-id="${p.id}">수정</button>
              <button class="btn btn-danger-soft btn-sm" data-action="delete" data-id="${p.id}">삭제</button>
            </div>
          </div>
        `;
      }).join('');
    }

    // Render Checklist
    function renderChecklist() {
      const container = document.getElementById('checklistContainer');
      const total = state.checklist.length;
      const done = state.checklist.filter(c => c.done).length;
      document.getElementById('checkProgressText').textContent = `${done} / ${total} 완료`;

      if (total === 0) {
        container.innerHTML = `<div class="empty-state">체크리스트 항목이 없습니다.</div>`;
        return;
      }

      const categories = ['행정·인수인계', '전역 준비', '말출 목표'];
      container.innerHTML = categories.map(cat => {
        const items = state.checklist.filter(c => c.category === cat);
        if (items.length === 0) return '';
        return `
          <div class="check-group-title">${cat}</div>
          ${items.map(item => `
            <div class="check-item">
              <label class="check-left">
                <input type="checkbox" data-action="toggle-check" data-id="${item.id}" ${item.done ? 'checked' : ''} />
                <span class="check-text ${item.done ? 'done' : ''}">${escapeHtml(item.text)}</span>
              </label>
              <button class="btn btn-danger-soft btn-sm" data-action="delete-check" data-id="${item.id}">삭제</button>
            </div>
          `).join('')}
        `;
      }).join('');
    }

    function renderSettings() {
      document.getElementById('setEnlist').value = state.enlistDate;
      document.getElementById('setDischarge').value = state.dischargeDate;
    }

    function escapeHtml(str) {
      return String(str)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;');
    }

    function renderAll() {
      renderHero();
      renderDashboard();
      renderPlans();
      renderChecklist();
      renderSettings();
    }

    // Event Listeners: Tabs
    document.getElementById('tabBar').addEventListener('click', (e) => {
      const btn = e.target.closest('.tab-btn');
      if (!btn) return;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(btn.dataset.tab).classList.add('active');
    });

    // Event Listeners: Leave Pool Inputs
    ['inAnnual', 'inReward', 'inOther', 'inExpected'].forEach(id => {
      document.getElementById(id).addEventListener('input', () => {
        state.leavePool = {
          annual: Math.max(0, Number(document.getElementById('inAnnual').value || 0)),
          reward: Math.max(0, Number(document.getElementById('inReward').value || 0)),
          other: Math.max(0, Number(document.getElementById('inOther').value || 0)),
          expected: Math.max(0, Number(document.getElementById('inExpected').value || 0))
        };
        saveState();
        renderDashboard();
      });
    });

    // Event Listeners: Malchul Calculator
    document.getElementById('malchulDays').addEventListener('input', (e) => {
      state.malchulCalc.days = Math.max(1, Number(e.target.value || 1));
      saveState();
      renderMalchulPreview();
    });

    document.getElementById('malchulType').addEventListener('change', (e) => {
      state.malchulCalc.type = e.target.value;
      saveState();
      renderMalchulPreview();
    });

    document.getElementById('btnApplyRemainToMalchul').addEventListener('click', () => {
      const { remain } = getLeaveSummary();
      if (remain <= 0) {
        showToast('남은 휴가 일수가 1일 이상이어야 합니다.');
        return;
      }
      state.malchulCalc.days = remain;
      saveState();
      renderDashboard();
      showToast(`잔여 휴가 ${remain}일이 적용되었습니다.`);
    });

    document.getElementById('btnAddMalchulPlan').addEventListener('click', () => {
      const { startStr, endStr, isNoReturn } = getMalchulRange();
      const existing = state.plans.find(p => p.type === '말출');
      if (existing) {
        existing.start = startStr;
        existing.end = endStr;
        existing.memo = isNoReturn ? '미복귀 전역 말출' : '전역 전날 복귀 말출';
      } else {
        state.plans.push({
          id: 'p_' + Date.now(),
          title: '말년휴가 (말출)',
          type: '말출',
          start: startStr,
          end: endStr,
          noDeduct: false,
          memo: isNoReturn ? '미복귀 전역 말출' : '전역 전날 복귀 말출'
        });
      }
      saveState();
      renderAll();
      showToast('말출 일정이 휴가 일정표에 반영되었습니다.');
    });

    // Event Listeners: Plan Form
    document.getElementById('planType').addEventListener('change', (e) => {
      document.getElementById('planNoDeduct').checked = e.target.value === '외박/외출';
    });

    function resetPlanForm() {
      document.getElementById('editPlanId').value = '';
      document.getElementById('planTitle').value = '';
      document.getElementById('planType').value = '중간휴가';
      document.getElementById('planStart').value = '';
      document.getElementById('planEnd').value = '';
      document.getElementById('planNoDeduct').checked = false;
      document.getElementById('planMemo').value = '';
      document.getElementById('formHeading').textContent = '새 휴가·외박 일정 추가';
      document.getElementById('btnCancelEdit').style.display = 'none';
    }

    document.getElementById('btnCancelEdit').addEventListener('click', resetPlanForm);

    document.getElementById('btnSavePlan').addEventListener('click', () => {
      const id = document.getElementById('editPlanId').value;
      const title = document.getElementById('planTitle').value.trim();
      const type = document.getElementById('planType').value;
      const start = document.getElementById('planStart').value;
      const end = document.getElementById('planEnd').value;
      const noDeduct = document.getElementById('planNoDeduct').checked;
      const memo = document.getElementById('planMemo').value.trim();

      if (!title || !start || !end) {
        showToast('일정명과 시작일, 종료일을 모두 입력해 주세요.');
        return;
      }
      if (calcInclusiveDays(start, end) <= 0) {
        showToast('종료일은 시작일과 같거나 이후여야 합니다.');
        return;
      }

      if (id) {
        const target = state.plans.find(p => p.id === id);
        if (target) Object.assign(target, { title, type, start, end, noDeduct, memo });
        showToast('일정이 수정되었습니다.');
      } else {
        state.plans.push({ id: 'p_' + Date.now(), title, type, start, end, noDeduct, memo });
        showToast('새 일정이 추가되었습니다.');
      }

      saveState();
      resetPlanForm();
      renderAll();
    });

    // Event Delegation: Plan List
    document.getElementById('planList').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-action]');
      if (!btn) return;
      const { action, id } = btn.dataset;

      if (action === 'delete') {
        if (!confirm('이 일정을 삭제할까요?')) return;
        state.plans = state.plans.filter(p => p.id !== id);
        saveState();
        renderAll();
        showToast('일정이 삭제되었습니다.');
      } else if (action === 'edit') {
        const p = state.plans.find(item => item.id === id);
        if (!p) return;
        document.getElementById('editPlanId').value = p.id;
        document.getElementById('planTitle').value = p.title;
        document.getElementById('planType').value = p.type;
        document.getElementById('planStart').value = p.start;
        document.getElementById('planEnd').value = p.end;
        document.getElementById('planNoDeduct').checked = !!p.noDeduct;
        document.getElementById('planMemo').value = p.memo || '';
        document.getElementById('formHeading').textContent = '일정 수정 중';
        document.getElementById('btnCancelEdit').style.display = 'inline-flex';
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    });

    // Event Listeners: Checklist
    document.getElementById('btnAddCheck').addEventListener('click', () => {
      const category = document.getElementById('checkCategory').value;
      const input = document.getElementById('checkInput');
      const text = input.value.trim();
      if (!text) {
        showToast('항목 내용을 입력해 주세요.');
        return;
      }
      state.checklist.push({ id: 'c_' + Date.now(), category, text, done: false });
      input.value = '';
      saveState();
      renderChecklist();
      showToast('체크리스트에 추가되었습니다.');
    });

    document.getElementById('checklistContainer').addEventListener('click', (e) => {
      const target = e.target.closest('[data-action]');
      if (!target) return;
      const { action, id } = target.dataset;

      if (action === 'toggle-check') {
        const item = state.checklist.find(c => c.id === id);
        if (item) {
          item.done = target.checked;
          saveState();
          renderChecklist();
        }
      } else if (action === 'delete-check') {
        state.checklist = state.checklist.filter(c => c.id !== id);
        saveState();
        renderChecklist();
        showToast('항목이 삭제되었습니다.');
      }
    });

    // Event Listeners: Settings & Backup
    document.getElementById('btnSaveDates').addEventListener('click', () => {
      const enlist = document.getElementById('setEnlist').value;
      const discharge = document.getElementById('setDischarge').value;
      if (!enlist || !discharge || parseDate(discharge) <= parseDate(enlist)) {
        showToast('올바른 입대일과 전역일을 입력해 주세요.');
        return;
      }
      state.enlistDate = enlist;
      state.dischargeDate = discharge;
      saveState();
      renderAll();
      showToast('복무 기간이 업데이트되었습니다.');
    });

    document.getElementById('btnExportJson').addEventListener('click', async () => {
      const json = JSON.stringify(state, null, 2);
      try {
        await navigator.clipboard.writeText(json);
        showToast('백업 JSON이 클립보드에 복사되었습니다.');
      } catch {
        prompt('아래 JSON을 복사해 보관하세요:', json);
      }
    });

    document.getElementById('btnImportJson').addEventListener('click', () => {
      const raw = prompt('백업해 둔 JSON 데이터를 붙여넣으세요:');
      if (!raw) return;
      try {
        const parsed = JSON.parse(raw);
        if (!parsed.dischargeDate || !Array.isArray(parsed.plans)) {
          throw new Error('Invalid format');
        }
        state = parsed;
        saveState();
        renderAll();
        showToast('데이터가 복원되었습니다.');
      } catch {
        showToast('올바른 JSON 형식이 아닙니다.');
      }
    });

    document.getElementById('btnResetAll').addEventListener('click', () => {
      if (!confirm('모든 데이터를 초기 상태로 되돌릴까요?')) return;
      state = structuredClone(DEFAULT_STATE);
      saveState();
      renderAll();
      showToast('초기화되었습니다.');
    });

    renderAll();
  </script>
</body>
</html>
